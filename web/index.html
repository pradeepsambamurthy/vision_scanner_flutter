<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- ✅ Required for Vercel & custom domains -->
  <base href="/" />

  <meta name="description" content="PeekVision - AI-Assisted Eye Disorder Detection" />

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="apple-mobile-web-app-title" content="peekvision" />
  <link rel="apple-touch-icon" href="icons/Icon-192.png" />

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png" />

  <title>PeekVision</title>
  <link rel="manifest" href="manifest.json" />

  <script>
    // ✅ Disable any old service worker that can break fresh deploys
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(regs => regs.forEach(r => r.unregister()));
    }
  </script>
</head>
<body>
  <!-- ✅ Main app entry -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
