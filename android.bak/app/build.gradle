// android/app/build.gradle  (Groovy)

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'dev.flutter.flutter-gradle-plugin'
    id 'com.google.gms.google-services'   // Google services plugin (version declared in project build.gradle.kts)
}

android {
    namespace 'com.example.eyesight_flutter'     // change if your package differs
    compileSdkVersion 34                        

    defaultConfig {
        applicationId "com.example.eyesight_flutter"
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion 34
        versionCode 1
        versionName "1.0.0"
        multiDexEnabled true
    }

    buildTypes {
        release {
            // Use debug signing for now. Replace with your keystore when you’re ready.
            signingConfig signingConfigs.debug
        }
    }

    // Java/Kotlin 17 for AGP 8.x
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildTypes {
        release {
            signingConfig signingConfigs.debug
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib"
}