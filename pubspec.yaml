name: eyesight_flutter
description: Demo DR screening app with TFLite
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.9.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter
  image: ^4.1.7  
  path_provider: ^2.1.4
  share_plus: ^10.0.2
  collection: ^1.18.0
  shared_preferences: ^2.2.3
  pdf: ^3.11.3
  printing: ^5.13.4
  firebase_core: ^4.1.0
  firebase_auth: ^6.0.2
  cloud_firestore: ^6.0.1
  open_filex: ^4.5.0

  # Social sign-in
  google_sign_in: ^6.2.1
  flutter_facebook_auth: ^7.0.1
  

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/charts/snellen_lines.json
    - assets/models/dr_mobilenetv2_fp16.tflite
    - assets/models/glasses_classifier.tflite
    - assets/models/age_gender.tflite
    - assets/images/eye_bg.png
    - assets/models/labels.txt
