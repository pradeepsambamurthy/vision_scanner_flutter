name: eyesight_flutter
description: Demo DR screening app with TFLite
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.9.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter

  # Core app deps
  camera: ^0.10.6
  tflite_flutter: ^0.11.0
  image: ^4.1.7
  image_picker: ^1.1.2
  path_provider: ^2.1.4
  collection: ^1.18.0
  shared_preferences: ^2.2.3
  google_mlkit_face_detection: ^0.13.1
  permission_handler: ^11.3.1
 

  # PDF/printing
  pdf: ^3.11.3
  printing: ^5.13.4

  # Firebase
  firebase_core: ^3.4.0
  firebase_auth: ^5.2.0
  cloud_firestore: ^5.4.4

  # Social sign-in
  google_sign_in: ^6.2.1
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/charts/snellen_lines.json
    - assets/models/dr_mobilenetv2_fp16.tflite
    - assets/models/glasses_classifier.tflite
    - assets/models/age_gender.tflite
    - assets/images/eye_bg.png
    - assets/images/logo_peekvision.png
